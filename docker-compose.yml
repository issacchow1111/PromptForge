version: '3.8'

services:
  backend:
    build:
      context: ./server-dotnet/PromptForge.Proxy
      dockerfile: Dockerfile
    container_name: promptforge-backend
    ports:
      - "3000:3000"
    env_file:
      - ./server-dotnet/PromptForge.Proxy/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptforge-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
